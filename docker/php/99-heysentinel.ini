; HeySentinel dev tuning — overrides Sail defaults to make `php artisan serve` snappy.
; Mounted into /etc/php/8.5/cli/conf.d/99-heysentinel.ini by compose.yaml.

; Enable OPcache for CLI (php artisan serve runs as CLI, so it needs this).
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
; Keep timestamp validation on in dev so code changes are picked up automatically.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Larger realpath cache helps with Filament's deep file lookups.
realpath_cache_size=4096K
realpath_cache_ttl=600
