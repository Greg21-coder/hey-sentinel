; HeySentinel dev tuning — mounted into /etc/php/8.5/cli/conf.d/99-heysentinel.ini by compose.yaml.

xdebug.mode=off

; OPcache off in dev.  uses PHP_CLI_SERVER_WORKERS=4 which
; pre-forks workers — children inherit the parent's compiled-script cache and
; keep serving stale bytecode for the lifetime of the master, even with
; validate_timestamps=1. Turning OPcache off in CLI eliminates that staleness
; (fine in dev, where response time is dominated by DB/Redis I/O).
; Re-enable in production with validate_timestamps=0 + explicit cache reset on deploy.
opcache.enable_cli=0

realpath_cache_size=4096K
realpath_cache_ttl=600
